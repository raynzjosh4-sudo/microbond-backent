name: Microbond CI/CD - Google Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Security: Grants GitHub Actions permission to mint OIDC tokens for GCP Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west1 # or africa-south1
  GAR_REPOSITORY: microbond-backend
  SERVICE_NAME: microbond-api
  WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }} # Format: projects/12345/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }} # Format: github-deployer@my-project.iam.gserviceaccount.com

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Unit & Integration Tests
        run: |
          pytest \
            tests/test_payout_verification.py \
            tests/test_rate_limit_and_idempotency.py \
            tests/test_internal_tasks.py \
            tests/test_payment_gateway_integration.py \
            -v

  build-and-deploy:
    name: Build & Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Tag Docker Image
        id: build-image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          LATEST_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
        run: |
          docker build \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run with Zero Downtime
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.build-image.outputs.image }}
          flags: |
            --port=8080
            --cpu=1
            --memory=1Gi
            --min-instances=1
            --max-instances=20
            --concurrency=80
            --timeout=60s
            --service-account=${{ env.WIF_SERVICE_ACCOUNT }}
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,INTERNAL_TASKS_KEY=INTERNAL_TASKS_KEY:latest,PAYMENT_GATEWAY_WEBHOOK_SECRET=PAYMENT_GATEWAY_WEBHOOK_SECRET:latest,REDIS_URL=REDIS_URL:latest
            --set-env-vars=ENVIRONMENT=production,ENABLE_IN_PROCESS_SCHEDULER=false
