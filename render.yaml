services:
  - type: web
    name: microbond-api
    env: docker
    dockerfilePath: Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INTERNAL_TASKS_KEY
        sync: false
      - key: PAYMENT_GATEWAY_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PREMBLY_PUBLIC_KEY
        sync: false
      - key: PREMBLY_SECRET_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: SUMSUB_APP_TOKEN
        sync: false
      - key: SUMSUB_SECRET_KEY
        sync: false
      - key: MTN_API_USER
        sync: false
      - key: MTN_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_API_SECRET
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
