[package]
name = "microbond_core"
version = "0.1.0"
edition = "2021"
authors = ["Microbond Team"]
description = "High-performance authoritative financial rules and deterministic state engine for Microbond"

[lib]
name = "microbond_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
